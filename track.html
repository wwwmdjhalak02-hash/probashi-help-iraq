<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আবেদনের স্ট্যাটাস ট্র্যাকিং - Probashi Help Iraq</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
  <div style="height:18px"></div>
  <div class="form-card app-card">
    <h2 style="margin:0 0 6px 0;color:var(--text);font-size:20px;">আবেদনের স্ট্যাটাস পরীক্ষা</h2>
    <p style="margin:0;color:var(--muted);font-size:13px">আপনার ট্র্যাকিং আইডি (যেমন: PHI-123456) নিচে লিখুন:</p>

    <div style="margin-top:12px">
      <input class="input" type="text" id="trackInput" placeholder="PHI-XXXXXX" />
      <button id="searchBtn" class="glow-button" style="width:100%;margin-top:12px">খুঁজুন</button>
    </div>

    <div id="resultBox" class="app-card hidden" style="margin-top:14px;padding:14px;border-radius:12px">
        <h3 id="resName" style="margin:0;color:var(--text);"></h3>
        <p style="font-size:13px;color:var(--muted);margin:6px 0 0 0" id="resType"></p>
        <p style="font-size:13px;color:var(--text);margin:8px 0 0 0" id="resDesc"></p>
        <hr style="border-color: rgba(255,255,255,0.04);margin:12px 0">
        <div>অবস্থা: <span id="resStatus" class="status-badge"></span></div>
    </div>

    <p id="notFound" class="hidden" style="margin-top:12px;color:var(--muted);font-size:13px">এই ট্র্যাকিং আইডির কোনো আবেদন পাওয়া যায়নি!</p>

  </div>

  <nav class="bottom-nav">
    <a href="home.html">হোম</a>
    <a href="index.html">আবেদন</a>
    <a href="notice.html">নোটিশ</a>
    <a href="chat-support.html">সহায়তা</a>
  </nav>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://probashi-help-iraq-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const searchBtn = document.getElementById('searchBtn');
    const trackInput = document.getElementById('trackInput');
    const resultBox = document.getElementById('resultBox');
    const notFound = document.getElementById('notFound');

    searchBtn.addEventListener('click', () => {
        const trackId = trackInput.value.trim();
        if (!trackId) {
            alert('অনুগ্রহ করে ট্র্যাকিং আইডি দিন');
            return;
        }

        // UI states
        searchBtn.disabled = true;
        searchBtn.innerText = 'অনুসন্ধান...';
        resultBox.classList.add('hidden');
        notFound.classList.add('hidden');

        get(ref(db, 'requests')).then((snapshot) => {
            const data = snapshot.val();
            let found = false;

            if (data) {
                Object.values(data).forEach(req => {
                    if (req.trackId === trackId) {
                        found = true;
                        document.getElementById('resName').innerText = req.name || 'Unknown';
                        document.getElementById('resType').innerText = "সেবা: " + (req.issueType || 'N/A');
                        document.getElementById('resDesc').innerText = req.issueDesc || '';

                        const statusEl = document.getElementById('resStatus');
                        statusEl.innerText = req.status || 'Pending';

                        statusEl.className = 'status-badge';
                        if (req.status === 'Accepted') {
                            statusEl.classList.add('status-accepted');
                        } else if (req.status === 'Rejected') {
                            statusEl.classList.add('status-rejected');
                        } else {
                            statusEl.classList.add('status-pending');
                        }

                        resultBox.classList.remove('hidden');
                        // scroll into view for small screens
                        resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                });
            }

            if (!found) {
                notFound.classList.remove('hidden');
            }

        }).catch((err) => {
            alert('ত্রুটি: ' + err.message);
        }).finally(() => {
            searchBtn.disabled = false;
            searchBtn.innerText = 'খুঁজুন';
        });
    });
</script>

</body>
</html>
