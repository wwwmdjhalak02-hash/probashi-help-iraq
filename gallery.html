<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গ্যালারি - Probashi Help Iraq</title>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: #fff; margin: 0; padding: 16px; text-align: center; }
        h2 { color: #38bdf8; margin-bottom: 16px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
        .card { background: #1e293b; padding: 8px; border-radius: 8px; border: 1px solid #334155; }
        .card img { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; }
        .card p { font-size: 12px; color: #cbd5e1; margin: 6px 0 2px 0; }
    </style>
</head>
<body>
    <h2>ফটো গ্যালারি</h2>

    <div class="gallery-grid">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1548013146-72479768bada?w=400" alt="ইরাক">
            <p>বাগদাদ শহর</p>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1512632578888-169bbbc64f33?w=400" alt="সেবা কার্যক্রম">
            <p>আমাদের সেবা কেন্দ্র</p>
        </div>
    </div>
</body>
</html>
