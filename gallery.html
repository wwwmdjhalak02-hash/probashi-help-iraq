<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গ্যালারি - Probashi Help Iraq</title>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: #fff; margin: 0; padding: 16px; text-align: center; }
        h2 { color: #38bdf8; margin-bottom: 16px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .card { background: #1e293b; padding: 8px; border-radius: 8px; border: 1px solid #334155; }
        .card img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; }
        .card p { font-size: 13px; color: #cbd5e1; margin: 8px 0 2px 0; }
    </style>
</head>
<body>
    <h2>ফটো গ্যালারি</h2>

    <div class="gallery-grid">
        <div class="card">
            <img src="https://picsum.photos/id/1015/300/200" alt="দূতাবাস কার্যক্রম">
            <p>দূতাবাস কার্যক্রম</p>
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/1018/300/200" alt="ত্রাণ ও সাহায্য প্রদান">
            <p>ত্রাণ ও সাহায্য প্রদান</p>
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/1025/300/200" alt="মেডিকেল ক্যাম্প">
            <p>মেডিকেল ক্যাম্প</p>
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/1035/300/200" alt="আইনি পরামর্শ সভা">
            <p>আইনি পরামর্শ সভা</p>
        </div>
    </div>
</body>
</html>
