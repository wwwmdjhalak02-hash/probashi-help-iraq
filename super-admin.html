<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সুপার এডমিন প্যানেল - প্রবাসী সাহায্য</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen p-4">
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <div class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
            <h1 class="text-xl font-bold text-amber-500"><i class="fas fa-chart-line mr-2"></i>Admin Panel (সুপার এডমিন)</h1>
            <a href="home.html" class="text-xs bg-slate-700 px-3 py-2 rounded-lg text-slate-300">হোমে যান</a>
        </div>

        <!-- Top Metrics Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-gradient-to-r from-blue-600 to-blue-500 p-4 rounded-xl shadow-lg">
                <p class="text-xs text-blue-100 font-medium">ইউজার অনলাইন</p>
                <h2 class="text-2xl font-extrabold mt-1">১২০</h2>
            </div>
            <div class="bg-gradient-to-r from-cyan-600 to-cyan-500 p-4 rounded-xl shadow-lg">
                <p class="text-xs text-cyan-100 font-medium">মোট টিকিট জেনারেট</p>
                <h2 class="text-2xl font-extrabold mt-1">৩৩,৩৫৯</h2>
            </div>
            <div class="bg-gradient-to-r from-amber-600 to-amber-500 p-4 rounded-xl shadow-lg">
                <p class="text-xs text-amber-100 font-medium">সাম্প্রতিক ইভেন্ট</p>
                <h2 class="text-2xl font-extrabold mt-1">১৫</h2>
            </div>
            <div class="bg-gradient-to-r from-purple-600 to-purple-500 p-4 rounded-xl shadow-lg">
                <p class="text-xs text-purple-100 font-medium">সক্রিয় এজেন্ট</p>
                <h2 class="text-2xl font-extrabold mt-1">৮</h2>
            </div>
        </div>

        <!-- User Requests Table -->
        <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
            <h2 class="text-md font-bold text-slate-200 mb-4"><i class="fas fa-user-clock text-amber-500 mr-2"></i>আবেদনকারীদের তালিকা (User Requests)</h2>
            <div class="space-y-3">
                <div class="flex items-center justify-between bg-slate-900 p-3 rounded-xl border border-slate-700">
                    <div>
                        <p class="font-bold text-sm text-slate-200">আদানান রশন</p>
                        <p class="text-xs text-slate-400">পাসপোর্ট রিনিউ সহায়তা</p>
                    </div>
                    <div class="flex gap-2">
                        <span class="text-xs bg-amber-500/10 text-amber-500 px-2.5 py-1 rounded-md">পেন্ডিং</span>
                        <button class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1 rounded-md">মঞ্জুর</button>
                    </div>
                </div>
                <div class="flex items-center justify-between bg-slate-900 p-3 rounded-xl border border-slate-700">
                    <div>
                        <p class="font-bold text-sm text-slate-200">সিটারম ফেরাম</p>
                        <p class="text-xs text-slate-400">আইনি ও আকামা জরুরি সাহায্য</p>
                    </div>
                    <div class="flex gap-2">
                        <span class="text-xs bg-amber-500/10 text-amber-500 px-2.5 py-1 rounded-md">পেন্ডিং</span>
                        <button class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1 rounded-md">মঞ্জুর</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
