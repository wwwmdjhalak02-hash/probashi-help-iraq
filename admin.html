<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন প্যানেল - Probashi Help Iraq</title>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: #fff; margin: 0; padding: 16px; }
        h2, h3 { color: #38bdf8; text-align: center; }
        .pin-box { max-width: 320px; margin: 60px auto; background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
        .pin-box input { width: 80%; padding: 10px; margin: 12px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; text-align: center; font-size: 18px; }
        .pin-box button { width: 85%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
        .req-card { background: #1e293b; padding: 16px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #334155; position: relative; }
        .user-name { font-weight: bold; color: #f8fafc; font-size: 16px; }
        .track-id { font-size: 11px; background: #334155; padding: 2px 6px; border-radius: 4px; color: #38bdf8; display: inline-block; margin-bottom: 6px; }
        .req-type { color: #38bdf8; font-size: 13px; margin: 4px 0; }
        .req-info { color: #94a3b8; font-size: 12px; margin-bottom: 6px; }
        .req-desc { color: #cbd5e1; font-size: 14px; margin-bottom: 12px; background: #0f172a; padding: 8px; border-radius: 6px; }
        .actions { display: flex; gap: 8px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; }
        .btn-accept { background-color: #22c55e; }
        .btn-reject { background-color: #ef4444; }
        .btn-delete { background-color: #64748b; padding: 4px 8px; font-size: 12px; border: none; border-radius: 4px; color: #fff; cursor: pointer; float: right; }
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; width: 100%; text-align: center; box-sizing: border-box; }
        .no-data { text-align: center; color: #94a3b8; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="loginBox" class="pin-box">
        <h3>অ্যাডমিন পিন দিন</h3>
        <input type="password" id="pinInput" placeholder="****">
        <button id="loginBtn">প্রবেশ করুন</button>
    </div>

    <div id="adminContent" class="hidden">
        <h2>আবেদন ম্যানেজমেন্ট প্যানেল</h2>
        <div id="requestsList"><p class="no-data">ডাটা লোড হচ্ছে...</p></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://probashi-help-iraq-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.getElementById('loginBtn').addEventListener('click', () => {
            const pin = document.getElementById('pinInput').value;
            if (pin === '1234') {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                loadRequests();
            } else {
                alert('ভুল পিন নম্বর!');
            }
        });

        function loadRequests() {
            const listDiv = document.getElementById('requestsList');
            onValue(ref(db, 'requests'), (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    listDiv.innerHTML = '<p class="no-data">কোনো নতুন আবেদন পাওয়া যায়নি</p>';
                    return;
                }

                listDiv.innerHTML = '';
                Object.keys(data).reverse().forEach(key => {
                    const req = data[key];
                    const card = document.createElement('div');
                    card.className = 'req-card';

                    let actionContent = '';
                    if (req.status === 'Accepted') {
                        actionContent = `<span class="status-badge" style="background:#22c55e">Accepted</span>`;
                    } else if (req.status === 'Rejected') {
                        actionContent = `<span class="status-badge" style="background:#ef4444">Rejected</span>`;
                    } else {
                        actionContent = `
                            <button class="btn btn-accept" onclick="changeStatus('${key}', 'Accepted')">Accept</button>
                            <button class="btn btn-reject" onclick="changeStatus('${key}', 'Rejected')">Reject</button>
                        `;
                    }

                    card.innerHTML = `
                        <button class="btn-delete" onclick="deleteReq('${key}')">ডিলিট</button>
                        <span class="track-id">ID: ${req.trackId || 'N/A'}</span>
                        <div class="user-name">${req.name || 'Unknown'}</div>
                        <div class="req-type">📌 ${req.issueType || 'N/A'}</div>
                        <div class="req-info">📞 ${req.phone || 'N/A'} | 📍 ${req.location || 'N/A'}</div>
                        <div class="req-desc">${req.issueDesc || 'No details'}</div>
                        <div class="actions">${actionContent}</div>
                    `;
                    listDiv.appendChild(card);
                });
            });
        }

        window.changeStatus = function(key, status) {
            update(ref(db, 'requests/' + key), { status: status });
        };

        window.deleteReq = function(key) {
            if (confirm('আবেদনটি মুছে ফেলতে চান?')) {
                remove(ref(db, 'requests/' + key));
            }
        };
    </script>
</body>
</html>
