<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সাহায্যের আবেদন - প্রবাসী হেল্প ইরাক</title>
    <style>
        :root {
            --bg-primary: #090d16;
            --bg-card: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-gold: #f59e0b;
            --accent-gold-hover: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Hind Siliguri', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.08) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .wrapper {
            width: 100%;
            max-width: 540px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 36px;
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
        }

        .header-title {
            text-align: center;
            margin-bottom: 28px;
        }

        .header-title h2 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header-title p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            color: var(--text-main);
            font-family: inherit;
            font-size: 15px;
            transition: var(--transition);
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        select {
            cursor: pointer;
        }

        select option {
            background: #0f172a;
            color: var(--text-main);
        }

        textarea {
            resize: vertical;
            min-height: 115px;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #090d16;
            border: none;
            border-radius: 0.75rem;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
        }

        /* Master Loading State Spinner */
        .btn-submit.is-loading {
            opacity: 0.85;
            pointer-events: none;
        }

        .btn-submit.is-loading span {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-submit.is-loading span::after {
            content: "";
            width: 18px;
            height: 18px;
            border: 2px solid #090d16;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success-box {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 28px;
            border-radius: 1rem;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .success-box h3 {
            color: #34d399;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .success-box p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .track-id-badge {
            background: rgba(15, 23, 42, 0.8);
            border: 1px dashed #34d399;
            padding: 12px;
            border-radius: 0.75rem;
            margin: 16px 0;
            color: #34d399;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .track-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
            color: var(--accent-gold);
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }

        .track-link:hover {
            color: var(--accent-gold-hover);
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 640px) {
            .card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="card">
        <div class="header-title">
            <h2>সেবা বা সাহায্যের আবেদন</h2>
            <p>আপনার সঠিক তথ্য দিয়ে নিচের ফর্মটি পূরণ করুন</p>
        </div>

        <form id="helpForm">
            <div class="form-group">
                <label>আপনার নাম</label>
                <input type="text" id="name" required placeholder="আপনার পূর্ণ নাম লিখুন">
            </div>

            <div class="form-group">
                <label>ফোন / হোয়াটসঅ্যাপ নম্বর</label>
                <input type="tel" id="phone" required placeholder="যেমন: +964...">
            </div>

            <div class="form-group">
                <label>হোয়াটসঅ্যাপ নম্বর (ঐচ্ছিক)</label>
                <input type="tel" id="whatsapp" placeholder="হোয়াটসঅ্যাপ নম্বর থাকলে দিন">
            </div>

            <div class="form-group">
                <label>ইরাকে আপনার বর্তমান স্থান/শহর</label>
                <input type="text" id="location" required placeholder="যেমন: বাগদাদ, এরবিল">
            </div>

            <div class="form-group">
                <label>সমস্যার ধরন</label>
                <select id="issueType">
                    <option value="জরুরি আকামা সাহায্য">জরুরি আকামা সাহায্য</option>
                    <option value="আইনি সহায়তা">আইনি সহায়তা</option>
                    <option value="পাসপোর্ট নবায়ন">পাসপোর্ট নবায়ন</option>
                    <option value="জরুরি চিকিৎসা">জরুরি চিকিৎসা</option>
                    <option value="অন্যান্য">অন্যান্য</option>
                </select>
            </div>

            <div class="form-group">
                <label>জরুরি অবস্থা</label>
                <select id="urgency">
                    <option value="Normal">সাধারণ (Normal)</option>
                    <option value="Urgent">জরুরি (Urgent)</option>
                    <option value="Critical">অত্যন্ত জরুরি (Critical)</option>
                </select>
            </div>

            <div class="form-group">
                <label>সমস্যার বিস্তারিত বিবরণ</label>
                <textarea id="issue" rows="4" required placeholder="আপনার সমস্যার বিস্তারিত এখানে লিখুন..."></textarea>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                <span id="btnText">আবেদন জমা দিন</span>
            </button>
        </form>

        <div id="successBox" class="success-box hidden">
            <h3>অভিনন্দন! আপনার আবেদন সফল হয়েছে</h3>
            <p>আপনার রেফারেন্স বা ট্র্যাকিং আইডি:</p>
            <div class="track-id-badge" id="trackIdDisplay">PHI-VIP-2026</div>
            <p>এই তথ্যটি সুরক্ষিত রাখুন।</p>
            <a href="track.html" class="track-link">আবেদনের স্ট্যাটাস দেখুন ➔</a>
        </div>
    </div>
</div>

<script>
    document.getElementById('helpForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const whatsapp = document.getElementById('whatsapp').value.trim();
        const location = document.getElementById('location').value.trim();
        const issueType = document.getElementById('issueType').value;
        const urgency = document.getElementById('urgency').value;
        const issue = document.getElementById('issue').value.trim();

        if (!name || !phone || !issue) {
            alert('দয়া করে নাম, ফোন নম্বর এবং সমস্যার বিবরণ আবশ্যকভাবে পূরণ করুন!');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        
        // Enable Master Loading State
        submitBtn.classList.add('is-loading');
        btnText.innerText = "প্রসেস হচ্ছে...";

        try {
            const response = await fetch('/api/requests', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name, phone, whatsapp, location, issue_type: issueType, urgency, issue })
            });

            const result = await response.json();

            if (response.ok) {
                document.getElementById('helpForm').classList.add('hidden');
                if (result.requestId) {
                    document.getElementById('trackIdDisplay').innerText = 'PHI-' + result.requestId;
                }
                document.getElementById('successBox').classList.remove('hidden');
            } else {
                alert('ত্রুটি: ' + (result.message || 'আবেদন জমা দিতে সমস্যা হয়েছে।'));
                submitBtn.classList.remove('is-loading');
                btnText.innerText = "আবেদন জমা দিন";
            }
        } catch (error) {
            alert('নেটওয়ার্ক বা সার্ভার ত্রুটি! দয়া করে আবার চেষ্টা করুন।');
            submitBtn.classList.remove('is-loading');
            btnText.innerText = "আবেদন জমা দিন";
        }
    });
</script>

</body>
</html>
