<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সাহায্যের আবেদন - Probashi Help Iraq</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
  <div style="height:18px"></div>
  <div class="form-card app-card">
    <h2 style="margin:0 0 6px 0;color:var(--text);font-size:20px;">সেবা বা সাহায্যের আবেদন</h2>
    <p style="margin:0;color:var(--muted);font-size:13px;">আপনার সমস্যার ধরন নির্বাচন করে আবেদন করুন।</p>

    <form id="helpForm" style="margin-top:12px">
      <label class="form-label">আপনার নাম:</label>
      <input class="input" type="text" id="name" required placeholder="পূর্ণ নাম লিখুন">

      <label class="form-label">ফোন / হোয়াটসঅ্যাপ নম্বর:</label>
      <input class="input" type="tel" id="phone" required placeholder="+964...">

      <label class="form-label">ইরাকে আপনার বর্তমান স্থান/শহর:</label>
      <input class="input" type="text" id="location" required placeholder="যেমন: বাগদাদ, এরবিল">

      <label class="form-label">সমস্যার ধরন:</label>
      <select class="select" id="issueType">
          <option value="জরুরি আকামা সাহায্য">জরুরি আকামা সাহায্য</option>
          <option value="আইনি সহায়তা">আইনি সহায়তা</option>
          <option value="পাসপোর্ট নবায়ন">পাসপোর্ট নবায়ন</option>
          <option value="জরুরি চিকিৎসা">জরুরি চিকিৎসা</option>
          <option value="অন্যান্য">অন্যান্য</option>
      </select>

      <label class="form-label">সমস্যার বিস্তারিত বিবরণ:</label>
      <textarea class="textarea" id="issueDesc" rows="4" required placeholder="আপনার সমস্যার বিস্তারিত লিখুন..."></textarea>

      <button type="submit" id="submitBtn" class="glow-button" style="width:100%;margin-top:14px">আবেদন জমা দিন</button>
    </form>

    <div id="successBox" class="success-box hidden">
        <h3 style="margin:0;color:var(--text)">আপনার আবেদন জমা হয়েছে!</h3>
        <p style="margin:6px 0 0 0;color:var(--muted);font-size:13px">আপনার ট্র্যাকিং আইডি:</p>
        <div class="track-id" id="trackIdDisplay"></div>
        <p style="font-size:12px;color:var(--muted);margin-top:8px">এই আইডি দিয়ে পরবর্তীতে আপনার আবেদনের অবস্থা যাচাই করতে পারবেন।</p>
        <a href="track.html" class="ghost-button" style="display:inline-block;margin-top:10px;text-decoration:none">আবেদনের স্ট্যাটাস দেখুন ➔</a>
    </div>

  </div>

  <!-- bottom navigation (visual placeholder consistent with reference) -->
  <nav class="bottom-nav">
    <a href="home.html">হোম</a>
    <a href="index.html" class="active">আবেদন</a>
    <a href="notice.html">নোটিশ</a>
    <a href="chat-support.html">সহায়তা</a>
  </nav>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://probashi-help-iraq-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById('helpForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = "পাঠানো হচ্ছে...";
        submitBtn.disabled = true;

        const generatedTrackId = 'PHI-' + Math.floor(100000 + Math.random() * 900000);

        const newRequest = {
            trackId: generatedTrackId,
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            location: document.getElementById('location').value,
            issueType: document.getElementById('issueType').value,
            issueDesc: document.getElementById('issueDesc').value,
            status: 'Pending',
            timestamp: Date.now()
        };

        push(ref(db, 'requests'), newRequest).then(() => {
            document.getElementById('helpForm').classList.add('hidden');
            document.getElementById('trackIdDisplay').innerText = generatedTrackId;
            document.getElementById('successBox').classList.remove('hidden');
        }).catch((err) => {
            alert('সমস্যা হয়েছে: ' + err.message);
            submitBtn.innerText = "আবেদন জমা দিন";
            submitBtn.disabled = false;
        });
    });
</script>

</body>
</html>
