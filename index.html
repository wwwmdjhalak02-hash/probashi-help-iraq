<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সাহায্যের আবেদন - প্রবাসী হেল্প ইরাক</title>
    <style>
        :root {
            --bg-primary: #030712;
            --bg-card: rgba(15, 23, 42, 0.75);
            --border-color: rgba(51, 65, 85, 0.6);
            --accent-blue: #38bdf8;
            --accent-indigo: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 520px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .header-title {
            text-align: center;
            margin-bottom: 28px;
        }

        .header-title h2 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header-title p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        }

        select {
            cursor: pointer;
        }

        select option {
            background: #0f172a;
            color: var(--text-main);
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }

        .success-box {
            background: rgba(6, 95, 70, 0.3);
            border: 1px solid #10b981;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .success-box h3 {
            color: #34d399;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .success-box p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .track-id-badge {
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed #10b981;
            padding: 12px;
            border-radius: 10px;
            margin: 16px 0;
            color: #34d399;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .track-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
            color: var(--accent-blue);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }

        .track-link:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="card">
        <div class="header-title">
            <h2>সেবা বা সাহায্যের আবেদন</h2>
            <p>আপনার সঠিক তথ্য দিয়ে নিচের ফর্মটি পূরণ করুন</p>
        </div>

        <form id="helpForm">
            <div class="form-group">
                <label>আপনার নাম</label>
                <input type="text" id="name" required placeholder="আপনার পূর্ণ নাম লিখুন">
            </div>

            <div class="form-group">
                <label>ফোন / হোয়াটসঅ্যাপ নম্বর</label>
                <input type="tel" id="phone" required placeholder="যেমন: +964...">
            </div>

            <div class="form-group">
                <label>ইরাকে আপনার বর্তমান স্থান/শহর</label>
                <input type="text" id="location" required placeholder="যেমন: বাগদাদ, এরবিল">
            </div>

            <div class="form-group">
                <label>সমস্যার ধরন</label>
                <select id="issueType">
                    <option value="জরুরি আকামা সাহায্য">জরুরি আকামা সাহায্য</option>
                    <option value="আইনি সহায়তা">আইনি সহায়তা</option>
                    <option value="পাসপোর্ট নবায়ন">পাসপোর্ট নবায়ন</option>
                    <option value="জরুরি চিকিৎসা">জরুরি চিকিৎসা</option>
                    <option value="অন্যান্য">অন্যান্য</option>
                </select>
            </div>

            <div class="form-group">
                <label>সমস্যার বিস্তারিত বিবরণ</label>
                <textarea id="issueDesc" rows="4" required placeholder="আপনার সমস্যার বিস্তারিত এখানে লিখুন..."></textarea>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">আবেদন জমা দিন</button>
        </form>

        <div id="successBox" class="success-box hidden">
            <h3>অভিনন্দন! আপনার আবেদন সফল হয়েছে</h3>
            <p>আপনার ট্র্যাকিং আইডি:</p>
            <div class="track-id-badge" id="trackIdDisplay"></div>
            <p>এই আইডি দিয়ে পরবর্তীতে আপনার আবেদনের অবস্থা যাচাই করতে পারবেন।</p>
            <a href="track.html" class="track-link">আবেদনের স্ট্যাটাস দেখুন ➔</a>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://probashi-help-iraq-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById('helpForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const location = document.getElementById('location').value.trim();
        const issueDesc = document.getElementById('issueDesc').value.trim();

        if(!name || !phone || !location || !issueDesc) {
            alert('দয়া করে সব ফিল্ড সঠিকভাবে পূরণ করুন!');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = "প্রসেস হচ্ছে...";
        submitBtn.disabled = true;

        const generatedTrackId = 'PHI-' + Math.floor(100000 + Math.random() * 900000);

        const newRequest = {
            trackId: generatedTrackId,
            name: name,
            phone: phone,
            location: location,
            issueType: document.getElementById('issueType').value,
            issueDesc: issueDesc,
            status: 'Pending',
            timestamp: Date.now()
        };

        push(ref(db, 'requests'), newRequest).then(() => {
            document.getElementById('helpForm').classList.add('hidden');
            document.getElementById('trackIdDisplay').innerText = generatedTrackId;
            document.getElementById('successBox').classList.remove('hidden');
        }).catch((err) => {
            alert('ত্রুটি হয়েছে: ' + err.message);
            submitBtn.innerText = "আবেদন জমা দিন";
            submitBtn.disabled = false;
        });
    });
</script>

</body>
</html>
