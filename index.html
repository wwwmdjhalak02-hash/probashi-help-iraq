            <!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইরাক প্রবাসী হেল্প - Iraq Probashi Help</title>
    <style>
        :root {
            --bg-primary: #090d16;
            --bg-card: rgba(30, 41, 59, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-gold: #f59e0b;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            --transition: all 0.3s ease;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            padding: 15px 15px 80px 15px; /* নিচে ন্যাভিগেশন বারের জন্য জায়গা রাখা হয়েছে */
        }
        .container { max-width: 600px; margin: 0 auto; }

        /* হেডার ডিজাইন (স্ক্রিন ২ ও ৩ এর আদলে) */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 12px 16px;
            border-radius: 1rem;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }
        .app-title { font-size: 16px; font-weight: 700; color: var(--accent-gold); display: flex; align-items: center; gap: 8px; }
        .header-icons { display: flex; gap: 12px; font-size: 18px; color: var(--text-muted); cursor: pointer; }

        .profile-card, .card, .post-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: var(--shadow-lg);
        }
        .profile-card { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .user-info h3 { color: var(--accent-gold); font-size: 16px; }
        .user-info p { font-size: 12px; color: var(--text-muted); }
        .badges { display: flex; gap: 8px; }
        .badge { background: #0f172a; border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 0.5rem; text-align: center; }
        .badge span { display: block; font-size: 9px; color: var(--text-muted); }
        .badge strong { font-size: 13px; color: var(--accent-blue); }

        textarea {
            width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border-color);
            border-radius: 0.75rem; color: var(--text-main); font-size: 14px; resize: vertical; min-height: 80px; outline: none; margin-bottom: 10px;
            transition: var(--transition);
        }
        textarea:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15); }
        .btn-primary {
            width: 100%;
            padding: 10px 20px; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #090d16; border: none; border-radius: 0.75rem; font-weight: 700; cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }
        .btn-primary:hover { transform: translateY(-2px); }
        .security-alert { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 10px; border-radius: 0.5rem; font-size: 12px; margin-bottom: 10px; display: none; }
        
        .post-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: var(--accent-gold); }
        .post-content { font-size: 14px; margin-bottom: 12px; line-height: 1.4; }
        .post-actions { display: flex; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 10px; }
        .btn-action { background: #0f172a; border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 12px; border-radius: 0.4rem; cursor: pointer; font-size: 12px; transition: var(--transition); }
        .btn-action:hover { color: var(--text-main); border-color: var(--accent-gold); }
        .btn-share { color: var(--accent-blue); background: rgba(56, 189, 248, 0.1); }
        
        .admin-link { text-align: center; margin-top: 15px; margin-bottom: 20px; }
        .admin-link a { color: var(--text-muted); font-size: 11px; text-decoration: none; transition: var(--transition); }
        .admin-link a:hover { color: var(--accent-gold); }

        /* ফিক্সড বটম ন্যাভিগেশন বার (আপনার ডিজাইন অনুযায়ী একেবারে নিচের মেনু) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #0b132b;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .nav-item {
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: var(--transition);
        }
        .nav-item span.icon { font-size: 18px; margin-bottom: 2px; }
        .nav-item.active, .nav-item:hover { color: var(--accent-gold); }
    </style>
</head>
<body>

<div class="container">
    <!-- টপ হেডার (ডিজাইনের আদলে) -->
    <div class="app-header">
        <div class="app-title">🇮🇶 ইরাক প্রবাসী হেল্প</div>
        <div class="header-icons">
            <span onclick="location.href='chat-support.html'">💬</span>
            <span onclick="location.href='notice.html'">🔔</span>
        </div>
    </div>

    <!-- প্রফাইল ড্যাশবোর্ড -->
    <div class="profile-card">
        <div class="user-info">
            <h3 id="userNameDisplay">প্রবাসী ভাই (Active User)</h3>
            <p>স্ট্যাটাস: <span id="starRatingDisplay">⭐ ১ স্টার</span></p>
        </div>
        <div class="badges">
            <div class="badge"><span>লেভেল</span><strong id="levelDisplay">১ / ১০০</strong></div>
            <div class="badge"><span>শেয়ার</span><strong id="shareCountDisplay">০</strong></div>
        </div>
    </div>

    <!-- পোস্ট করার বক্স -->
    <div class="card">
        <h3>অভিজ্ঞতা বা তথ্য শেয়ার করুন</h3>
        <div id="securityAlert" class="security-alert"></div>
        <form id="postForm">
            <textarea id="postText" placeholder="আপনার মনের কথা লিখুন... (নম্বর, লিংক বা টাকার অংক সম্পূর্ণ নিষিদ্ধ)"></textarea>
            <button type="submit" class="btn-primary">পোস্ট প্রকাশ করুন</button>
        </form>
    </div>

    <!-- কমিউনিটি ফিড -->
    <div id="communityFeed"></div>

    <div class="admin-link">
        <a href="admin.html">⚙️ অ্যাডমিন ভেরিফিকেশন প্যানেল (১৯/৯৯ লক ম্যানেজমেন্ট)</a>
    </div>
</div>

<!-- আপনার ডিজাইন করা ১২ স্ক্রিনের সাথে মিল রেখে ফিক্সড নিচের ন্যাভিগেশন বার -->
<div class="bottom-nav">
    <a href="index.html" class="nav-item active">
        <span class="icon">🏠</span>
        <span>হোম</span>
    </a>
    <a href="index.html" class="nav-item">
        <span class="icon">👥</span>
        <span>সোশ্যাল</span>
    </a>
    <a href="jobs.html" class="nav-item">
        <span class="icon">💼</span>
        <span>চাকরি</span>
    </a>
    <a href="notice.html" class="nav-item">
        <span class="icon">📜</span>
        <span>নোটিশ</span>
    </a>
    <a href="passport-status.html" class="nav-item">
        <span class="icon">🛂</span>
        <span>পাসপোর্ট</span>
    </a>
    <a href="track.html" class="nav-item">
        <span class="icon">📍</span>
        <span>ট্র্যাক</span>
    </a>
    <a href="chat-support.html" class="nav-item">
        <span class="icon">💬</span>
        <span>সাপোর্ট</span>
    </a>
    <a href="profile.html" class="nav-item">
        <span class="icon">👤</span>
        <span>প্রোফাইল</span>
    </a>
</div>

<script>
    // 🤖 PHI Guardian Bot (স্বয়ংক্রয় সিকিউরিটি ফিল্টার)
    const PHIGuardianBot = {
        scanContent: function(text) {
            if (/(\+?\d{3,4}[-.\s]?)?\d{10,}|01[3-9]\d{8}|\+964\d+/.test(text)) {
                return { approved: false, reason: "🤖 সিকিউরিটি অ্যালার্ট: মোবাইল বা হোয়াটসঅ্যাপ নম্বর দেওয়া নিষেধ!" };
            }
            if (/(টাকা|টাকার|ডলার|ইউরো|দিরহাম|রিয়াল|دينار|دولار|USD|IQD|AED|\b\d+\s*(টাকা|টলার|دينار))\b/i.test(text)) {
                return { approved: false, reason: "🤖 সিকিউরিটি অ্যালার্ট: টাকার অংক বা আর্থিক লেনদেন লেখা নিষিদ্ধ!" };
            }
            if (/(https?:\/\/[^\s]+)|(www\.[^\s]+)|([a-zA-Z0-9-]+\.(com|net|org|ru|iq|xyz))/i.test(text)) {
                return { approved: false, reason: "🤖 সিকিউরিটি অ্যালার্ট: এক্সটার্নাল লিংক শেয়ার করা নিষেধ!" };
            }
            return { approved: true };
        }
    };

    let userStats = JSON.parse(localStorage.getItem('phi_user_stats')) || { level: 1, shares: 0, stars: 1, isLocked: false };

    function updateDisplay() {
        document.getElementById('levelDisplay').innerText = `${userStats.level} / ১০০`;
        document.getElementById('shareCountDisplay').innerText = userStats.shares;
        
        let star = "⭐ ১ স্টার";
        if(userStats.level >= 80) star = "⭐⭐⭐⭐⭐⭐⭐ ৭ স্টার";
        else if(userStats.level >= 60) star = "⭐⭐⭐⭐⭐⭐ ৬ স্টার";
        else if(userStats.level >= 40) star = "⭐⭐⭐⭐⭐ ৫ স্টার";
        else if(userStats.level >= 20) star = "⭐⭐⭐⭐ ৪ স্টার";
        else if(userStats.level >= 10) star = "⭐⭐⭐ ৩ স্টার";
        else if(userStats.level >= 5) star = "⭐⭐ ২ স্টার";
        
        document.getElementById('starRatingDisplay').innerText = star;
    }
    updateDisplay();

    document.getElementById('postForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const text = document.getElementById('postText').value.trim();
        const alertBox = document.getElementById('securityAlert');

        if (!text) { 
            alertBox.innerText = "দয়া করে কিছু লিখে পোস্ট করুন!"; 
            alertBox.style.display = "block"; 
            return; 
        }

        const check = PHIGuardianBot.scanContent(text);
        if (!check.approved) { 
            alertBox.innerText = check.reason; 
            alertBox.style.display = "block"; 
            return; 
        }
        alertBox.style.display = "none";

        // ১৯ বা ৯৯ লেভেলে পৌঁছালে লক করা
        if (userStats.level === 19 || userStats.level === 99) {
            userStats.isLocked = true;
            localStorage.setItem('phi_user_stats', JSON.stringify(userStats));
            alert('আপনার লেভেল সিকিউরিটি গেটওয়েতে লক হয়েছে। অ্যাডমিনের ভেরিফিকেশন প্রয়োজন!');
            return;
        }

        if (userStats.isLocked) {
            alert('অ্যাকাউন্টটি অ্যাডমিন অনুমোদনের অপেক্ষায় লক রয়েছে।');
            return;
        }

        userStats.level += 1;
        if(userStats.level % 15 === 0 && userStats.stars < 7) userStats.stars += 1;
        localStorage.setItem('phi_user_stats', JSON.stringify(userStats));
        updateDisplay();

        alert('পোস্ট সফল ও লেভেল আপডেট হয়েছে!');
        document.getElementById('postText').value = '';
    });

    function loadFeed() {
        document.getElementById('communityFeed').innerHTML = `
            <div class="post-card">
                <div class="post-header"><span>প্রবাসী রফিক ভাই ⭐⭐⭐</span><span>১০ মিনিট আগে</span></div>
                <div class="post-content">ইরাকের কর্মক্ষেত্রে কাজের ফাঁকে সবাই সাবধানে থাকবেন।</div>
                <div class="post-actions">
                    <div style="display: flex; gap: 8px;">
                        <button class="btn-action">👍 লাইক</button>
                        <button class="btn-action">👎 আনলাইক</button>
                    </div>
                    <button class="btn-action btn-share" onclick="handleShare()">🔗 শেয়ার</button>
                </div>
            </div>`;
    }

    window.handleShare = function() {
        userStats.shares += 1;
        localStorage.setItem('phi_user_stats', JSON.stringify(userStats));
        updateDisplay();
        alert('শেয়ার সফল হয়েছে! আপনার শেয়ার কাউন্ট আপডেট হয়েছে।');
    }
    loadFeed();
</script>
</body>
</html>
