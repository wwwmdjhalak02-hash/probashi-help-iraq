<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোফাইল ও হোম - প্রবাসী হেল্প ইরাক</title>
    <style>
        :root {
            --bg-primary: #030712;
            --bg-card: rgba(15, 23, 42, 0.85);
            --border-color: rgba(51, 65, 85, 0.6);
            --accent-blue: #38bdf8;
            --accent-indigo: #6366f1;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 20px 85px 20px; /* নিচের ন্যাভিগেশন বারের জন্য জায়গা রাখা হয়েছে */
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
        }

        .container {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 28px 20px;
            box-shadow: var(--shadow-lg);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
        }

        /* ভিআইপি ইউজার স্ট্যাটাস মিনি কার্ড */
        .user-status-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 10px 14px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        .user-status-card span { color: var(--accent-gold); font-weight: 600; }

        .grid-menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .menu-btn {
            background: rgba(30, 41, 59, 0.7);
            color: var(--text-main);
            text-decoration: none;
            padding: 16px 12px;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .menu-btn span.icon {
            font-size: 24px;
            transition: transform 0.3s ease;
        }

        .menu-btn:hover {
            background: rgba(51, 65, 85, 0.8);
            border-color: var(--accent-blue);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.2);
        }

        .menu-btn:hover span.icon {
            transform: scale(1.15);
        }

        .primary-btn {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            border-color: transparent;
            grid-column: span 2;
            padding: 15px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
            margin-bottom: 12px;
        }

        .primary-btn:hover {
            background: linear-gradient(135deg, #1d4ed8, #4338ca);
            border-color: transparent;
            box-shadow: 0 12px 25px rgba(37, 99, 235, 0.6);
        }

        /* ফিক্সড বটম ন্যাভিগেশন বার */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #0b132b;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .nav-item {
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: var(--transition);
        }
        .nav-item span.icon { font-size: 18px; margin-bottom: 2px; }
        .nav-item.active, .nav-item:hover { color: var(--accent-gold); }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="container">
        <div class="header">
            <h1>Probashi Help Iraq</h1>
            <p>ইরাকে অবস্থানরত প্রবাসী বাংলাদেশীদের বিশ্বস্ত সহায়তা হাব</p>
        </div>

        <!-- ডাইনামিক লোকালস্টোরেজ স্ট্যাটাস উইজেট -->
        <div class="user-status-card" id="homeUserStats">
            <div>অ্যাকাউন্ট স্ট্যাটাস: <span id="syncLevelText">লেভেল ১ / ১০০</span></div>
            <div id="syncStarText">⭐ ১ স্টার</div>
        </div>

        <a href="index.html" class="menu-btn primary-btn">
            <span class="icon">🆘</span> সেবা বা সাহায্যের আবেদন করুন
        </a>

        <div class="grid-menu">
            <a href="notice.html" class="menu-btn">
                <span class="icon">📢</span> নোটিশ বোর্ড
            </a>
            <a href="jobs.html" class="menu-btn">
                <span class="icon">💼</span> চাকরির বিজ্ঞপ্তি
            </a>
            <a href="gallery.html" class="menu-btn">
                <span class="icon">🖼️</span> ফটো গ্যালারি
            </a>
            <a href="chat-support.html" class="menu-btn">
                <span class="icon">📞</span> যোগাযোগ ও সাপোর্ট
            </a>
        </div>
    </div>
</div>

<!-- নিচের ন্যাভিগেশন বার -->
<div class="bottom-nav">
    <a href="home.html" class="nav-item active">
        <span class="icon">🏠</span>
        <span>হোম</span>
    </a>
    <a href="index.html" class="nav-item">
        <span class="icon">👥</span>
        <span>সোশ্যাল</span>
    </a>
    <a href="jobs.html" class="nav-item">
        <span class="icon">💼</span>
        <span>চাকরি</span>
    </a>
    <a href="notice.html" class="nav-item">
        <span class="icon">📜</span>
        <span>নোটিশ</span>
    </a>
    <a href="passport-status.html" class="nav-item">
        <span class="icon">🛂</span>
        <span>পাসপোর্ট</span>
    </a>
    <a href="track.html" class="nav-item">
        <span class="icon">📍</span>
        <span>ট্র্যাক</span>
    </a>
    <a href="chat-support.html" class="nav-item">
        <span class="icon">💬</span>
        <span>সাপোর্ট</span>
    </a>
    <a href="profile.html" class="nav-item">
        <span class="icon">👤</span>
        <span>প্রোফাইল</span>
    </a>
</div>

<script>
    function syncHomeStats() {
        const userStats = JSON.parse(localStorage.getItem('phi_user_stats')) || { level: 1, stars: 1 };
        
        document.getElementById('syncLevelText').innerText = `লেভেল ${userStats.level} / ১০০`;
        
        let starStr = "⭐ ১ স্টার";
        if(userStats.level >= 80) starStr = "⭐⭐⭐⭐⭐⭐⭐ ৭ স্টার";
        else if(userStats.level >= 60) starStr = "⭐⭐⭐⭐⭐⭐ ৬ স্টার";
        else if(userStats.level >= 40) starStr = "⭐⭐⭐⭐⭐ ৫ স্টার";
        else if(userStats.level >= 20) starStr = "⭐⭐⭐⭐ ৪ স্টার";
        else if(userStats.level >= 10) starStr = "⭐⭐⭐ ৩ স্টার";
        else if(userStats.level >= 5) starStr = "⭐⭐ ২ স্টার";

        document.getElementById('syncStarText').innerText = starStr;
    }

    syncHomeStats();
</script>

</body>
</html>
