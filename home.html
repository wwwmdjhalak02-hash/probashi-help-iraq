<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোফাইল ও হোম - প্রবাসী হেল্প ইরাক</title>
    <style>
        :root {
            --bg-primary: #030712;
            --bg-card: rgba(15, 23, 42, 0.75);
            --border-color: rgba(51, 65, 85, 0.6);
            --accent-blue: #38bdf8;
            --accent-indigo: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
        }

        .container {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-top: 16px;
        }

        .menu-btn {
            background: rgba(30, 41, 59, 0.7);
            color: var(--text-main);
            text-decoration: none;
            padding: 20px 14px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .menu-btn span {
            font-size: 26px;
            transition: transform 0.3s ease;
        }

        .menu-btn:hover {
            background: rgba(51, 65, 85, 0.8);
            border-color: var(--accent-blue);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.2);
        }

        .menu-btn:hover span {
            transform: scale(1.15);
        }

        .primary-btn {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            border-color: transparent;
            grid-column: span 2;
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }

        .primary-btn:hover {
            background: linear-gradient(135deg, #1d4ed8, #4338ca);
            border-color: transparent;
            box-shadow: 0 12px 25px rgba(37, 99, 235, 0.6);
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="container">
        <div class="header">
            <h1>Probashi Help Iraq</h1>
            <p>ইরাকে অবস্থানরত প্রবাসী বাংলাদেশীদের বিশ্বস্ত সহায়তা</p>
        </div>

        <a href="index.html" class="menu-btn primary-btn">
            <span>🆘</span> সেবা বা সাহায্যের আবেদন করুন
        </a>

        <div class="grid-menu">
            <a href="notice.html" class="menu-btn">
                <span>📢</span> নোটিশ বোর্ড
            </a>
            <a href="jobs.html" class="menu-btn">
                <span>💼</span> চাকরির বিজ্ঞপ্তি
            </a>
            <a href="gallery.html" class="menu-btn">
                <span>🖼️</span> ফটো গ্যালারি
            </a>
            <a href="chat-support.html" class="menu-btn">
                <span>📞</span> যোগাযোগ ও সাপোর্ট
            </a>
        </div>
    </div>
</div>

</body>
</html>
