<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Dashboard - Probashi Help Iraq</title>
    <style>
        :root {
            --bg-primary: #07111f;
            --bg-card: rgba(13, 27, 42, 0.88);
            --border-color: rgba(255, 255, 255, 0.09);
            --accent-primary: #19c3a3;
            --accent-blue: #4f8cff;
            --accent-gold: #f59e0b;
            --text-main: #f5f7fa;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', system-ui, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }
        .header h1 { font-size: 20px; color: var(--accent-primary); }
        .header p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 15px; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(7, 17, 31, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--accent-primary); }
        
        .btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-blue));
            color: #07111f;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .request-card {
            background: rgba(7, 17, 31, 0.6);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .req-info strong { font-size: 14px; color: #fff; display: block; }
        .req-info span { font-size: 12px; color: var(--text-muted); }
        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-pending { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); }
        .badge-approved { background: rgba(34, 197, 94, 0.15); color: var(--success); }
        
        .nav-links { display: flex; gap: 15px; margin-top: 15px; }
        .nav-links a { color: var(--accent-primary); text-decoration: none; font-size: 13px; }
        .nav-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Header -->
    <div class="header">
        <div>
            <h1>এজেন্ট ড্যাশবোর্ড (Agent Portal)</h1>
            <p>প্রবাসীর সমস্যা ও রিকোয়েস্ট সরাসরি পরিচালনা করুন</p>
        </div>
        <div style="text-align: right;">
            <span class="badge badge-approved">Active Agent</span>
        </div>
    </div>

    <!-- Send Request Box -->
    <div class="card">
        <div class="card-title">নতুন রিকোয়েস্ট বা বার্তা পাঠান</div>
        <div class="form-group">
            <label>প্রবাসীর নাম / আইডি</label>
            <input type="text" id="agentUserName" placeholder="যেমন: আব্দুর রহিম">
        </div>
        <div class="form-group">
            <label>সমস্যা বা সেবার বিবরণ</label>
            <textarea id="agentUserMsg" rows="3" placeholder="পাসপোর্ট বা অন্যান্য সমস্যা এখানে লিখুন..."></textarea>
        </div>
        <button class="btn" onclick="sendAgentRequest()">অ্যাডমিনের কাছে পাঠান</button>
    </div>

    <!-- Live Requests List -->
    <div class="card">
        <div class="card-title">
            <span>সাম্প্রতিক রিকোয়েস্টসমূহ</span>
            <span style="font-size: 12px; color: var(--text-muted);" id="reqCount">মোট: ০</span>
        </div>
        <div id="agentRequestsList">
            <div style="text-align: center; color: var(--text-muted); padding: 20px;">কোনো রিকোয়েস্ট পাওয়া যায়নি</div>
        </div>
    </div>

    <div class="nav-links">
        <a href="admin.html">← অ্যাডমিন প্যানেলে যান</a>
        <a href="index.html">ইউজার ড্যাশবোর্ড</a>
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // Firebase Configuration & Initialization
    const firebaseConfig = {
        databaseURL: "https://probashi-help-iraq-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    // Send Request to Firebase & LocalStorage
    function sendAgentRequest() {
        const name = document.getElementById('agentUserName').value.trim();
        const msg = document.getElementById('agentUserMsg').value.trim();

        if (!name || !msg) {
            alert('দয়া করে নাম এবং বিবরণ উভয়ই পূরণ করুন!');
            return;
        }

        const requestData = {
            name: name,
            serviceType: msg,
            phone: 'Agent Portal',
            timestamp: Date.now(),
            status: 'Pending'
        };

        // Push to Firebase Realtime Database
        database.ref('requests').push(requestData, (error) => {
            if (error) {
                alert('ডেটা পাঠাতে সমস্যা হয়েছে!');
            } else {
                alert('রিকোয়েস্ট সফলভাবে অ্যাডমিন প্যানেলে পাঠানো হয়েছে!');
                document.getElementById('agentUserName').value = '';
                document.getElementById('agentUserMsg').value = '';
            }
        });
    }

    // Real-time listener for requests
    database.ref('requests').on('value', (snapshot) => {
        const data = snapshot.val();
        const listContainer = document.getElementById('agentRequestsList');
        const countSpan = document.getElementById('reqCount');

        if (!data) {
            listContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px;">কোনো রিকোয়েস্ট পাওয়া যায়নি</div>`;
            countSpan.textContent = 'মোট: ০';
            return;
        }

        let htmlContent = '';
        const keys = Object.keys(data).reverse();
        countSpan.textContent = `মোট: ${keys.length}`;

        keys.forEach((key) => {
            const item = data[key];
            htmlContent += `
                <div class="request-card">
                    <div class="req-info">
                        <strong>${item.name || 'অজ্ঞাত ইউজার'}</strong>
                        <span>${item.serviceType || 'সাধারণ সেবা'} • ${new Date(item.timestamp || Date.now()).toLocaleDateString('bn-BD')}</span>
                    </div>
                    <span class="badge badge-pending">${item.status || 'Pending'}</span>
                </div>
            `;
        });

        listContainer.innerHTML = htmlContent;
    });
</script>

</body>
</html>
