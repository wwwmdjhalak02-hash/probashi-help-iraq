<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লাইভ চ্যাট সাপোর্ট - প্রবাসী সাহায্য</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-4">
    <div class="max-w-md w-full mx-auto flex-1 flex flex-col">
        <!-- Chat Header -->
        <div class="flex items-center justify-between bg-slate-800 p-4 rounded-t-2xl border border-slate-700">
            <div class="flex items-center gap-3">
                <a href="home.html" class="text-slate-400 hover:text-white"><i class="fas fa-arrow-left"></i></a>
                <div>
                    <h2 class="font-bold text-amber-500 text-sm">সাপোর্ট এজেন্ট (অনলাইন)</h2>
                    <p class="text-xs text-slate-400">প্রবাসী সাহায্য সহায়তা টিম</p>
                </div>
            </div>
            <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
        </div>

        <!-- Chat Area -->
        <div id="chatMessages" class="flex-1 bg-slate-900 border-x border-slate-700 p-4 space-y-3 overflow-y-auto min-h-[350px]">
            <div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none text-xs max-w-[80%] border border-slate-700">
                <p class="text-slate-200">আসসালামু আলাইকুম! "প্রবাসী সাহায্য"-এ আপনাকে স্বাগতম। কীভাবে সাহায্য করতে পারি?</p>
                <span class="text-[10px] text-slate-500 mt-1 block">১০:৩০ AM</span>
            </div>
        </div>

        <!-- Chat Input -->
        <form onsubmit="sendMessage(event)" class="flex gap-2 bg-slate-800 p-3 rounded-b-2xl border border-slate-700">
            <input type="text" id="msgInput" placeholder="এখানে বার্তা লিখুন..." required class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
            <button type="submit" class="bg-amber-500 text-slate-900 px-4 py-2 rounded-xl text-xs font-bold"><i class="fas fa-paper-plane"></i></button>
        </form>
    </div>

    <script>
        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('msgInput');
            const container = document.getElementById('chatMessages');
            
            if (!input.value.trim()) return;

            container.innerHTML += `
                <div class="bg-amber-500 text-slate-900 p-3 rounded-2xl rounded-tr-none text-xs max-w-[80%] ml-auto font-medium shadow-md">
                    <p>${input.value}</p>
                    <span class="text-[10px] text-slate-800 mt-1 block text-right">এখন</span>
                </div>
            `;
            input.value = '';
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
